name: Test and publish studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify state, motion and public bundle
        run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in *.js scripts/*.mjs; do node --check "$file"; done
      - name: Verify storage, authorization and media serving
        run: python3 -m unittest server_storage_test -v
      - name: Build public studio
        run: npm run build
      - name: Package Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish studio
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, Linux, X64, mvbg]
    timeout-minutes: 15
    concurrency:
      group: mvbg-production
      cancel-in-progress: false
    environment:
      name: mvbg-production
      url: https://mvbg.arrc.app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy persistent server behind Caddy
        env:
          GSMV_ADMIN_PASSWORD_HASH: ${{ secrets.GSMV_ADMIN_PASSWORD_HASH }}
        run: bash scripts/deploy-server.sh
